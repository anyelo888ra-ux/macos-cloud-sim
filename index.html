<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Cloud Simulator — Web OS Experience</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap');

        body {
            font-family: -apple-system, 'SF Pro Display', BlinkMacSystemFont, sans-serif;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }

        .macos-glass {
            background: rgba(30, 30, 35, 0.75);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .macos-window {
            background: rgba(22, 22, 26, 0.88);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 50px 100px rgba(0,0,0,0.7);
            position: absolute;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .window-header {
            cursor: grab;
        }
        .window-header:active {
            cursor: grabbing;
        }

        .dock-icon {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .dock-icon:hover {
            transform: scale(1.3) translateY(-8px);
        }
    </style>
</head>
<body class="h-screen w-screen relative flex flex-col justify-between overflow-hidden">

    <!-- macOS Top Menu Bar -->
    <div class="h-7 w-full macos-glass z-50 flex items-center justify-between px-4 text-xs font-medium text-white/90 border-b border-white/10">
        <div class="flex items-center gap-4">
            <i class="fa-brands fa-apple text-sm hover:text-sky-400 cursor-pointer"></i>
            <span class="font-bold cursor-pointer hover:text-sky-400">Finder</span>
            <span class="cursor-pointer hover:text-sky-400 hidden sm:inline">Archivo</span>
            <span class="cursor-pointer hover:text-sky-400 hidden sm:inline">Edición</span>
            <span class="cursor-pointer hover:text-sky-400 hidden sm:inline">Visualización</span>
            <span class="cursor-pointer hover:text-sky-400 hidden sm:inline">Ir</span>
            <span class="cursor-pointer hover:text-sky-400 hidden sm:inline">Ventana</span>
        </div>
        <div class="flex items-center gap-4">
            <i class="fa-solid fa-wifi"></i>
            <i class="fa-solid fa-battery-three-quarters"></i>
            <span id="clock-display">12:00 PM</span>
        </div>
    </div>

    <!-- Escritorio Principal / Área de Ventanas -->
    <div id="desktop-area" class="flex-grow relative overflow-hidden p-6">
        <!-- Iconos de Escritorio -->
        <div class="grid grid-cols-1 gap-6 w-20">
            <div class="flex flex-col items-center gap-1 cursor-pointer group" ondblclick="openApp('obs')">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-zinc-800 to-zinc-600 border border-white/20 flex items-center justify-center text-2xl shadow-xl group-hover:scale-105 transition">
                    <i class="fa-solid fa-video text-red-400"></i>
                </div>
                <span class="text-[11px] font-medium text-white drop-shadow-md text-center">OBS Studio</span>
            </div>
        </div>
    </div>

    <!-- Ventana OBS Studio Web -->
    <div id="app-obs" class="macos-window hidden w-[750px] h-[500px] z-40 top-20 left-40">
        <div class="window-header bg-zinc-900/90 px-4 py-2.5 flex justify-between items-center border-b border-white/10">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-rose-500 cursor-pointer hover:opacity-80" onclick="closeApp('obs')"></div>
                <div class="w-3 h-3 rounded-full bg-amber-500 cursor-pointer hover:opacity-80"></div>
                <div class="w-3 h-3 rounded-full bg-emerald-500 cursor-pointer hover:opacity-80"></div>
            </div>
            <span class="text-xs font-semibold text-white/80">OBS Studio Web — Captura Real</span>
            <i class="fa-solid fa-video text-red-400 text-xs"></i>
        </div>
        <div class="flex-grow bg-black flex flex-col justify-between p-4 relative">
            <div class="w-full h-[360px] bg-zinc-950 rounded-xl overflow-hidden border border-white/10 flex items-center justify-center relative">
                <video id="obs-preview" class="w-full h-full object-contain" autoplay playsinline muted></video>
                <div id="obs-placeholder" class="absolute text-xs text-white/40 font-mono">Haz clic en "Iniciar Captura" para mostrar tu pantalla</div>
            </div>
            <div class="flex justify-between items-center pt-2">
                <div class="flex gap-2">
                    <button onclick="startObsCapture()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-xs font-bold rounded-lg border border-white/10 text-sky-400 transition">Iniciar Captura</button>
                    <button onclick="startObsRecording()" id="rec-btn" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-xs font-bold rounded-lg text-white transition">Iniciar Grabación</button>
                </div>
                <span id="obs-status" class="text-[10px] font-mono text-white/50">Estado: Detenido</span>
            </div>
        </div>
    </div>

    <!-- macOS Dock Inferior -->
    <div class="w-full flex justify-center pb-3 z-50">
        <div class="macos-glass px-4 py-2 rounded-2xl flex items-center gap-4 shadow-2xl border border-white/20">
            <div onclick="openApp('obs')" class="dock-icon cursor-pointer flex flex-col items-center group">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-zinc-800 to-zinc-600 border border-white/20 flex items-center justify-center text-xl shadow-lg">
                    <i class="fa-solid fa-video text-red-400"></i>
                </div>
            </div>
            <div class="w-[1px] h-8 bg-white/20 mx-1"></div>
            <div onclick="alert('Próximamente: VMware Virtual Machine')" class="dock-icon cursor-pointer flex flex-col items-center group">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-700 to-indigo-600 border border-white/20 flex items-center justify-center text-xl shadow-lg">
                    <i class="fa-solid fa-server text-white"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Principal macOS Engine -->
    <script>
        // Reloj en tiempo real
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock-display').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        // Control de Ventanas
        function openApp(appName) {
            const app = document.getElementById(`app-${appName}`);
            if (app) app.classList.remove('hidden');
        }

        function closeApp(appName) {
            const app = document.getElementById(`app-${appName}`);
            if (app) app.classList.add('hidden');
        }

        // OBS Studio Funcional (Captura de pantalla real)
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];

        async function startObsCapture() {
            try {
                mediaStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                const videoElement = document.getElementById('obs-preview');
                videoElement.srcObject = mediaStream;
                document.getElementById('obs-placeholder').style.display = 'none';
                document.getElementById('obs-status').innerText = 'Estado: Capturando Pantalla';
            } catch (err) {
                alert('Permiso de captura denegado o cancelado.');
            }
        }

        function startObsRecording() {
            if (!mediaStream) {
                alert('Primero debes iniciar la captura de pantalla.');
                return;
            }
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'obs-gravacion-macos.webm';
                a.click();
                document.getElementById('obs-status').innerText = 'Estado: Grabación guardada';
            };

            mediaRecorder.start();
            const btn = document.getElementById('rec-btn');
            btn.innerText = 'Detener Grabación';
            btn.className = 'px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold rounded-lg text-white transition';
            btn.setAttribute('onclick', 'stopObsRecording()');
            document.getElementById('obs-status').innerText = 'Estado: Grabando...';
        }

        function stopObsRecording() {
            if (mediaRecorder) mediaRecorder.stop();
            const btn = document.getElementById('rec-btn');
            btn.innerText = 'Iniciar Grabación';
            btn.className = 'px-4 py-2 bg-red-600 hover:bg-red-500 text-xs font-bold rounded-lg text-white transition';
            btn.setAttribute('onclick', 'startObsRecording()');
        }

        // Arrastrar ventanas libremente (Drag & Drop)
        let activeWindow = null;
        let offsetX = 0, offsetY = 0;

        document.addEventListener('mousedown', (e) => {
            const header = e.target.closest('.window-header');
            if (header) {
                activeWindow = header.closest('.macos-window');
                const rect = activeWindow.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (activeWindow) {
                activeWindow.style.left = `${e.clientX - offsetX}px`;
                activeWindow.style.top = `${e.clientY - offsetY}px`;
            }
        });

        document.addEventListener('mouseup', () => { activeWindow = null; });
    </script>
</body>
</html>
